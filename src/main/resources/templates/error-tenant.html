<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:style="${'--primary:' + appThemePrimary + ';--primary-700:' + appThemePrimary + ';--accent:' + appThemePrimary + ';'}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instance introuvable - OSM</title>
    <style>
        :root {
            --bg:#F5F7FB;
            --surface:#FFFFFF;
            --shadow-dark: rgba(163,177,198,0.55);
            --shadow-light: rgba(255,255,255,0.85);
            --ink:#1F2937;
            --muted:#6B7280;
            --accent:#FF6F61;
            --accent-ink: var(--ink);
            --accent-ink: color-mix(in srgb, var(--accent) 25%, var(--ink) 75%);
            --accent-soft: rgba(255, 111, 97, 0.12);
            --accent-soft: color-mix(in srgb, var(--accent) 10%, #ffffff 90%);
            --radius: 18px;
        }
        * { box-sizing:border-box; }
        body {
            font-family: "Segoe UI", sans-serif;
            background:
                radial-gradient(900px 600px at 12% 15%, var(--accent-soft), transparent 60%),
                var(--bg);
            color:var(--ink);
            margin:0;
        }
        .wrap { max-width:760px; margin:60px auto; padding:0 20px; }
        .card {
            background:var(--surface);
            padding:24px;
            border-radius:var(--radius);
            border: 1px solid rgba(15,23,42,0.06);
            box-shadow: 14px 14px 28px var(--shadow-dark), -14px -14px 28px var(--shadow-light);
        }
        h1 { margin-top:0; }
        p { color:var(--muted); line-height:1.6; }
        code {
            background:var(--surface);
            padding:2px 6px;
            border-radius:10px;
            border: 1px solid rgba(15,23,42,0.06);
            box-shadow: inset 5px 5px 10px rgba(163,177,198,0.65), inset -5px -5px 10px rgba(255,255,255,0.9);
        }
        a { color:var(--accent-ink); font-weight:900; text-decoration:none; }
        /* Global text/link enforcement */
        :root {
            --primary: #1E88E5;
            --primary-hover: #1669B2;
            --secondary: #F3F4F6;
            --text: #1F2937;
            --muted: #6B7280;
            --bg: #F5F7FB;
            --surface: #FFFFFF;
            --success: #2BB673;
            --warning: #F6C945;
            --danger: #FF6F61;
        }
        body { color: var(--text); }
        body, body * { color: var(--text) !important; }
        h1, h2, h3, h4, h5, h6 { color: var(--primary) !important; }
        a { color: var(--primary) !important; }
        a:visited { color: var(--primary) !important; }
        a:hover { color: var(--primary) !important; text-decoration: underline; }
        input, select, textarea, option { color: var(--text) !important; }
        input::placeholder, textarea::placeholder { color: var(--text) !important; opacity: 0.7; }
        .muted, .hint, .help, .note, .caption, .meta, .meta-line, .subtle { color: var(--muted) !important; opacity: 0.7; }
        .btn, .btn * { color: inherit !important; }
        /* Primary button style for all buttons */
        .btn,
        button,
        input[type="button"],
        input[type="submit"],
        input[type="reset"],
        button.btn,
        a.btn,
        .nav-btn,
        .btn-primary,
        .btn-secondary,
        .btn-success,
        .btn-danger,
        .btn-warning,
        .btn-neutral {
            background: var(--primary) !important;
            border-color: var(--primary) !important;
            color: var(--secondary) !important;
            box-shadow: none !important;
            text-decoration: none;
        }
        /* Palette enforcement: Azure + Slate + Light Gray */
        :root {
            --primary: #1E88E5;
            --primary-hover: #1669B2;
            --secondary: #F3F4F6;
            --bg: #F5F7FB;
            --surface: #FFFFFF;
            --surface2: #F3F4F6;
            --border: rgba(31, 41, 55, 0.18);
            --ink: #1F2937;
            --muted: rgba(107, 114, 128, 0.75);
            --accent: #FF6F61;
            --accent-ink: #1F2937;
            --accent-soft: rgba(255, 111, 97, 0.12);
            --danger: #FF6F61;
            --warning: #F6C945;
            --success: #2BB673;
        }

        body { background: var(--bg) !important; color: var(--ink) !important; }
        h1, h2, h3, h4, h5, h6 { color: var(--primary) !important; }
        a { color: var(--primary) !important; }
        a:hover { color: var(--primary-hover) !important; }
        p, span, li, label, small, td, th { color: var(--ink) !important; }
        .muted, .text-muted, .meta-line { color: var(--muted) !important; }
        table, th, td { color: var(--ink) !important; }
        input, select, textarea, option {
            color: var(--ink) !important;
            background-color: var(--secondary) !important;
            border-color: var(--border) !important;
        }
        input::placeholder, textarea::placeholder { color: var(--muted) !important; }
        .btn, .btn-primary, .btn-secondary, .btn-neutral, .btn.primary, .btn.secondary,
        button, input[type="button"], input[type="submit"], input[type="reset"], .nav-btn {
            background: var(--primary) !important;
            border-color: var(--primary) !important;
            color: var(--secondary) !important;
        }
        .btn *, button * { color: inherit !important; }
        .status-active,
        .status-badge.status-active { color: var(--success) !important; }
        .status-inactive,
        .status-badge.status-inactive { color: var(--danger) !important; }
    </style>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/theme.css">
</head>
<body>
    <div class="wrap">
        <div class="card">
            <h1>Instance non reconnue</h1>
            <p>Impossible d'identifier l'etablissement pour cette page.</p>
            <p>Utilisez l'URL d'acces de l'etablissement ou, en mode developpement, ajoutez le parametre <code>?tenant=slug</code>.</p>
            <p><a href="/tenant/login">Aller a la connexion client</a></p>
        </div>
    </div>
    <style>
        :root {
            --btn-bg: var(--primary);
            --btn-text: #ffffff;
            --btn-hover-bg: var(--surface2);
            --btn-hover-text: var(--primary);
        }
        button, .btn, a.btn, input[type="submit"], input[type="button"] {
            background: var(--btn-bg) !important;
            border-color: var(--btn-bg) !important;
            color: var(--btn-text) !important;
        }
        button:focus, button:active, .btn:focus, .btn:active, a.btn:focus, a.btn:active {
            background: var(--btn-hover-bg) !important;
            border-color: var(--btn-bg) !important;
            color: var(--btn-hover-text) !important;
        }
        body, button, input, select, textarea {
            font-family: "Segoe UI", sans-serif !important;
        }
        a:hover {
            color: inherit !important;
            text-decoration: none !important;
        }
        /* soft-outline buttons */
        .btn, button, a.btn, .nav-btn, .nav-link, .icon-btn,
        input[type="button"], input[type="submit"], input[type="reset"] {
            background: #ffffff !important;
            border: 1.5px solid var(--primary, #1e88e5) !important;
            color: var(--primary, #1e88e5) !important;
            box-shadow: none !important;
            transform: none !important;
            filter: none !important;
            text-decoration: none;
        }
    </style>
</body>
</html>
